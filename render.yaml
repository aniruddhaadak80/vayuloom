services:
  - type: web
    name: vayuloom-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: PYTHON_URL
        value: https://vayuloom-agents.onrender.com

  - type: web
    name: vayuloom-agents
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    rootDir: services/agents
    region: singapore
    healthCheckPath: /health
