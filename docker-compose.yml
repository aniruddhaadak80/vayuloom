services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PYTHON_URL: "http://agents:8001"
    depends_on:
      agents:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agents:
    build: ./services/agents
    ports:
      - "8001:8001"
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
